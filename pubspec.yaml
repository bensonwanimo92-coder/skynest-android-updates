name: chuka
description: SkyNest Rental Management
publish_to: 'none'
version: 1.1.3+2025

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6
  cloud_firestore: ^5.5.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  google_mobile_ads: ^9.2.0
  table_calendar: ^3.0.9
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.3.5
  flutter_webrtc: ^1.6.3
  file_saver: ^0.7.0
  path_provider: ^2.1.6
  firebase_storage: ^12.3.7
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  audioplayers: ^6.1.0
  flutter_sound: ^9.16.3
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/sounds/sent.wav
    - assets/sounds/pop.wav
    - assets/sounds/ringing.wav

flutter_launcher_icons:
  android: true
  image_path: "assets/branding/skynest_launcher.png"
  adaptive_icon_background: "#061B63"
  adaptive_icon_foreground: "assets/branding/skynest_launcher.png"
  min_sdk_android: 21
