name: chuka
description: SkyNest Rental Management
publish_to: 'none'
version: 1.1.3+2025

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.15.0
  google_mobile_ads: ^9.2.0
  table_calendar: ^3.0.9
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  image_path: "assets/branding/skynest_launcher.png"
  adaptive_icon_background: "#061B63"
  adaptive_icon_foreground: "assets/branding/skynest_launcher.png"
  min_sdk_android: 21
