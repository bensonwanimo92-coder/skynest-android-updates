name: SkyNest OTA Patch (Exact Shorebird Release)

on:
  push:
    branches:
      - upgrade/mpesa-on-build-5506
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact Shorebird release version produced by the successful APK workflow'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skynest-ota-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.hello22_ --project-name chuka .
          if grep -q '^android.newDsl=' android/gradle.properties; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' android/gradle.properties
          else
            echo 'android.newDsl=false' >> android/gradle.properties
          fi
          grep -qx 'android.newDsl=false' android/gradle.properties
          sed -i 's/android:label="chuka"/android:label="SkyNest"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in s:
              s, count = re.subn(r"(?m)^(\s*)<application\b", lambda m: permission + "\n" + m.group(1) + "<application", s, count=1)
              if count != 1:
                  raise SystemExit("Could not find application tag to insert INTERNET permission.")
              p.write_text(s)
          print("Verified INTERNET permission in AndroidManifest.xml.")
          PY

      - name: Enforce Android 14 app configuration and audit manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected generated Kotlin Gradle file is missing.")
          source = gradle.read_text()
          for key, value in (("compileSdk", "36"), ("minSdk", "24"), ("targetSdk", "34")):
              source, count = re.subn(rf"(?m)^(\s*){key}\s*=\s*[^\n]+", rf"\g<1>{key} = {value}", source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not set {key} = {value}")
          # Let the Android Gradle Plugin select its default Build Tools version.
          # Explicit buildToolsVersion injection is unnecessary and brittle across DSL templates.
          gradle.write_text(source)

          # flutter_local_notifications requires Java 8+ API desugaring.
          # Enable it in the app module and add the matching desugar library.
          source = gradle.read_text()
          def insert_into_block(text, marker, statement):
              opening = text.find(marker)
              if opening < 0:
                  return None
              brace = text.find("{", opening)
              if brace < 0:
                  return None
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          line_start = text.rfind("\n", 0, opening) + 1
                          indent = re.match(r"\s*", text[line_start:opening]).group(0)
                          return text[:index] + "\n" + indent + "    " + statement + "\n" + text[index:]
              raise SystemExit("Unbalanced Gradle block: " + marker)

          if "isCoreLibraryDesugaringEnabled = true" not in source:
              updated = insert_into_block(source, "compileOptions {", "isCoreLibraryDesugaringEnabled = true")
              if updated is None:
                  updated = insert_into_block(source, "android {", "compileOptions {\n            isCoreLibraryDesugaringEnabled = true\n        }")
              if updated is None:
                  raise SystemExit("Could not locate Android Gradle block for core library desugaring.")
              source = updated

          if "coreLibraryDesugaring(" not in source:
              updated = insert_into_block(source, "dependencies {", 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")')
              if updated is None:
                  source += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n}\n"
              else:
                  source = updated

          if "isCoreLibraryDesugaringEnabled = true" not in source or "coreLibraryDesugaring(" not in source:
              raise SystemExit("Core library desugaring configuration is incomplete.")
          gradle.write_text(source)
          print("PASS: Core library desugaring enabled for flutter_local_notifications.")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          permissions = ["android.permission.INTERNET", "android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_DATA_SYNC", "android.permission.POST_NOTIFICATIONS", "android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO"]
          present = {p.get(android + "name") for p in root.findall("uses-permission")}
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifest has no application element.")
          insert_at = list(root).index(app)
          for permission in permissions:
              if permission not in present:
                  root.insert(insert_at, ET.Element("uses-permission", {android + "name": permission}))
                  insert_at += 1
          tools_ns = "{http://schemas.android.com/tools}"
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          for permission in ("android.permission.READ_EXTERNAL_STORAGE", "android.permission.WRITE_EXTERNAL_STORAGE"):
              if permission not in present:
                  root.insert(insert_at, ET.Element("uses-permission", {android + "name": permission, tools_ns + "node": "remove"}))
                  insert_at += 1
          for kind in ("activity", "activity-alias", "service", "receiver"):
              for item in app.findall(kind):
                  if item.get(android + "exported") is None:
                      item.set(android + "exported", "true" if item.find("intent-filter") is not None else "false")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          text = gradle.read_text()
          for expected in ('compileSdk = 36', 'minSdk = 24', 'targetSdk = 34'):
              if expected not in text:
                  raise SystemExit("Gradle configuration verification failed: " + expected)
          print("PASS: Android 14 app configuration and manifest.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          content = p.read_text()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1281241380359357~6894041283"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace("</application>", meta + "\n    </application>")
          p.write_text(content)
          PY

      - name: Install Android API 36 SDK and Build Tools
        run: |
          set -euo pipefail
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code $license_status."
            exit "$license_status"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Audit native Android source for platform compatibility requirements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("android/app/src/main/java"), Path("android/app/src/main/kotlin")]
          files = [p for root in roots if root.exists() for p in root.rglob("*") if p.suffix in (".kt", ".java")]
          source = "\n".join(p.read_text(errors="replace") for p in files)
          pending = re.findall(r"PendingIntent\s*\.\s*get(?:Activity|Service|Broadcast)\s*\(", source)
          if pending and "FLAG_IMMUTABLE" not in source and "FLAG_MUTABLE" not in source:
              raise SystemExit("PendingIntent calls found without an explicit mutability flag.")
          if ("setExact(" in source or "setExactAndAllowWhileIdle(" in source) and "canScheduleExactAlarms" not in source:
              raise SystemExit("Exact alarms found without canScheduleExactAlarms() handling.")
          print(f"Audited {len(files)} app-owned Kotlin/Java files.")
          PY

      - name: Configure Firebase Android app (optional)
        id: firebase
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_CONFIG_BASE64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase config is missing."
            exit 0
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          text = settings.read_text()
          marker = '    id("com.android.application")'
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(marker, '    id("com.google.gms.google-services") version "4.4.2" apply false\n' + marker, 1)
          settings.write_text(text)
          text = app.read_text()
          marker = '    id("dev.flutter.flutter-gradle-plugin")'
          if 'id("com.google.gms.google-services")' not in text:
              if marker not in text:
                  raise SystemExit("Could not locate Flutter Gradle plugin.")
              text = text.replace(marker, marker + '\n    id("com.google.gms.google-services")', 1)
          app.write_text(text)
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify original signing certificate and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/skynest-release.jks
          test -s android/app/skynest-release.jks
          keytool -list -v -keystore android/app/skynest-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/skynest-keytool-check.txt 2>&1
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' /tmp/skynest-keytool-check.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Signing certificate mismatch; stopping to protect installed-app updates."
            exit 1
          fi
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("skynest-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Could not attach release signing config.")
          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''    signingConfigs {
                  release {
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                      storeFile file('skynest-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          if 'signingConfig signingConfigs.release' not in s:
              raise SystemExit("Could not attach release signing config.")
          p.write_text(s)
          PY
          else
            echo "Flutter Android Gradle file not found."
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate custom SkyNest launcher icons
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert -background none assets/branding/skynest_launcher.svg -resize 1024x1024 assets/branding/skynest_launcher.png
          dart run flutter_launcher_icons

      - name: Align Flutter Android plugin compile SDK to API 36
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if not root.is_dir():
              raise SystemExit("Flutter pub cache not found.")
          auth_files = list(root.glob("firebase_auth-*/android/build.gradle*"))
          if not auth_files:
              raise SystemExit("firebase_auth Android Gradle file was not found.")
          patched = []
          for gradle_file in root.rglob("build.gradle*"):
              if "android" not in gradle_file.parts:
                  continue
              lines = gradle_file.read_text().splitlines()
              output = []
              changed = False
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith(("compileSdkVersion", "compileSdk ", "compileSdk=")):
                      output.append(indent + ("compileSdk = 36" if gradle_file.name.endswith(".gradle.kts") else "compileSdkVersion 36"))
                      changed = True
                  else:
                      output.append(line)
              if changed:
                  gradle_file.write_text("\n".join(output) + "\n")
                  patched.append(str(gradle_file))
          for auth_file in auth_files:
              if not any(line.strip() == "compileSdkVersion 36" for line in auth_file.read_text().splitlines()):
                  raise SystemExit(f"firebase_auth compile SDK was not set to 36: {auth_file}")
          print(f"Patched {len(patched)} Android plugin Gradle files.")
          PY

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Pin the exact newly built Shorebird release version
        env:
          PATCH_RELEASE_VERSION: ${{ inputs.release_version || '1.1.3+5518' }}
        run: |
          set -euo pipefail
          if ! [[ "$PATCH_RELEASE_VERSION" =~ ^1[.]1[.]3[+][0-9]+$ ]]; then
            echo "Invalid Shorebird release version: $PATCH_RELEASE_VERSION"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("pubspec.yaml")
          lines = p.read_text().splitlines()
          version = os.environ["PATCH_RELEASE_VERSION"]
          matches = [i for i, line in enumerate(lines) if line.startswith("version:")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one version entry in pubspec.yaml.")
          lines[matches[0]] = "version: " + version
          p.write_text("\n".join(lines) + "\n")
          if not Path("shorebird.yaml").is_file() or "- shorebird.yaml" not in p.read_text():
              raise SystemExit("shorebird.yaml asset is missing from patch source or Flutter assets.")
          print("Patch target pinned to " + version)
          PY

      - name: Publish Shorebird OTA patch for the exact release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PATCH_RELEASE_VERSION: ${{ inputs.release_version || '1.1.3+5518' }}
          SKYNEST_TURN_URL: ${{ secrets.SKYNEST_TURN_URL }}
          SKYNEST_TURN_USERNAME: ${{ secrets.SKYNEST_TURN_USERNAME }}
          SKYNEST_TURN_CREDENTIAL: ${{ secrets.SKYNEST_TURN_CREDENTIAL }}
          SKYNEST_API_BASE_URL: ${{ vars.SKYNEST_API_BASE_URL }}
        run: |
          set -euo pipefail
          if ! [[ "$PATCH_RELEASE_VERSION" =~ ^1[.]1[.]3[+][0-9]+$ ]]; then
            echo "::error::Invalid Shorebird release version: $PATCH_RELEASE_VERSION"
            exit 1
          fi
          BUILD_NUMBER="${PATCH_RELEASE_VERSION##*+}"
          # The ABI selector is a Flutter build argument, not a Shorebird patch option.
          # Flutter 3.47.0 is pinned above to match the base release toolchain.
          shorebird patch \
            --platforms=android \
            --release-version="$PATCH_RELEASE_VERSION" \
            --track=stable \
            -- \
            --target-platform=android-arm,android-arm64 \
            --build-name=1.1.3 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SKYNEST_TURN_URL="$SKYNEST_TURN_URL" \
            --dart-define=SKYNEST_TURN_USERNAME="$SKYNEST_TURN_USERNAME" \
            --dart-define=SKYNEST_TURN_CREDENTIAL="$SKYNEST_TURN_CREDENTIAL" \
            --dart-define=SKYNEST_API_BASE_URL="$SKYNEST_API_BASE_URL"
