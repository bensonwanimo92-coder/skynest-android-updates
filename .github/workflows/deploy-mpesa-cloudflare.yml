name: Deploy SkyNest M-Pesa Cloudflare Worker

on:
  push:
    branches:
      - release/5533-corrected-from-5532
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-mpesa-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrected Build 5533 branch
        uses: actions/checkout@v4
        with:
          ref: release/5533-corrected-from-5532

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker syntax and payment validation tests
        working-directory: cloudflare-worker
        run: npm run check

      - name: Deploy production Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.toml
