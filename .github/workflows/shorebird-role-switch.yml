name: SkyNest Role Switch OTA Patch

on:
  push:
    branches:
      - integration/roles-on-current-main
    paths:
      - 'lib/main.dart'
      - 'functions/**'
      - '.github/workflows/shorebird-role-switch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skynest-role-switch-ota
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.hello22_ --project-name chuka .
          sed -i 's/android:label="chuka"/android:label="SkyNest"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          for name, value in (("compileSdk", "35"), ("minSdk", "24"), ("targetSdk", "35")):
              s, count = re.subn(r"(?m)^(\\s*)" + name + r"\\s*=\\s*[^\\n]+",
                                 lambda m: m.group(1) + name + " = " + value, s, count=1)
              if count != 1:
                  raise SystemExit("Could not configure " + name)
          p.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in content:
              content = re.sub(r"(?m)^(\\s*)<application\\b",
                               lambda m: permission + "\\n" + m.group(1) + "<application", content, count=1)
          manifest.write_text(content)
          print("Android API 35 and internet permission configured.")
          PY

      - name: Exclude WorkManager automatic startup initializer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("android/app/src/main/AndroidManifest.xml")
          android_uri = "http://schemas.android.com/apk/res/android"
          tools_uri = "http://schemas.android.com/tools"
          ET.register_namespace("android", android_uri)
          ET.register_namespace("tools", tools_uri)
          android = "{" + android_uri + "}"
          tools = "{" + tools_uri + "}"
          tree = ET.parse(path)
          app = tree.getroot().find("application")
          provider = next((p for p in app.findall("provider")
                           if p.get(android + "name") == "androidx.startup.InitializationProvider"), None)
          if provider is None:
              provider = ET.SubElement(app, "provider", {
                  android + "name": "androidx.startup.InitializationProvider",
                  android + "authorities": "${applicationId}.androidx-startup",
                  android + "exported": "false",
                  tools + "node": "merge"
              })
          ET.SubElement(provider, "meta-data", {
              android + "name": "androidx.work.WorkManagerInitializer",
              tools + "node": "remove"
          })
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("WorkManager initializer removal directive configured.")
          PY

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          test "$license_status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Firebase Android app
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || { echo "::error::Missing FIREBASE_ANDROID_CONFIG_BASE64."; exit 1; }
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          names = [c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                   for c in config.get("client", [])]
          if config.get("project_info", {}).get("project_id") != "hello-chuka":
              raise SystemExit("Firebase Android config is not for project hello-chuka.")
          if "com.hello22_.chuka" not in names:
              raise SystemExit("Firebase Android config does not match com.hello22_.chuka.")
          print("Firebase Android configuration verified.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          s = settings.read_text()
          marker = '    id("com.android.application")'
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(marker, '    id("com.google.gms.google-services") version "4.4.2" apply false\\n' + marker, 1)
          settings.write_text(s)
          s = app.read_text()
          marker = '    id("dev.flutter.flutter-gradle-plugin")'
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(marker, marker + '\\n    id("com.google.gms.google-services")', 1)
          app.write_text(s)
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Align Android plugins to API 35
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          auth_files = list(root.glob("firebase_auth-*/android/build.gradle*"))
          if not auth_files:
              raise SystemExit("firebase_auth Android Gradle file was not found.")
          patched = 0
          for gradle_file in root.rglob("build.gradle*"):
              if "android" not in gradle_file.parts:
                  continue
              lines = gradle_file.read_text().splitlines()
              output = []
              changed = False
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith("compileSdkVersion") or stripped.startswith("compileSdk ") or stripped.startswith("compileSdk="):
                      output.append(indent + ("compileSdk = 35" if gradle_file.name.endswith(".gradle.kts") else "compileSdkVersion 35"))
                      changed = True
                  else:
                      output.append(line)
              if changed:
                  gradle_file.write_text("\\n".join(output) + "\\n")
                  patched += 1
          print("Patched " + str(patched) + " Android plugin Gradle files.")
          PY

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Deploy secure role-change Firebase function
        env:
          FIREBASE_SERVICE_ACCOUNT_SKYNEST: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKYNEST }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_SKYNEST:-}" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_SKYNEST repository secret. Add a Firebase service-account JSON with Cloud Functions deployment permissions."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_SKYNEST" > "$RUNNER_TEMP/skynest-firebase-service-account.json"
          python3 - "$RUNNER_TEMP/skynest-firebase-service-account.json" <<'PY'
          import json, sys
          from pathlib import Path
          account = json.loads(Path(sys.argv[1]).read_text())
          if account.get("project_id") != "hello-chuka" or not account.get("client_email") or not account.get("private_key"):
              raise SystemExit("Firebase deployment service account is invalid or belongs to another project.")
          print("Firebase deployment identity validated.")
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/skynest-firebase-service-account.json" >> "$GITHUB_ENV"
          npm install --global firebase-tools
          npm install --prefix functions --no-audit --no-fund
          firebase deploy --only functions:changeAccountRole --project hello-chuka --non-interactive

      - name: Publish Shorebird OTA patch for build 2046
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          shorebird patch android --release-version=1.1.3+2046 --artifact apk -- --no-shrink --no-obfuscate
