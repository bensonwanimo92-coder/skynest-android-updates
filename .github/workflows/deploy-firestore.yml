name: Deploy SkyNest Firestore and Storage rules (Spark-compatible)

on:
  push:
    branches:
      - integration/roles-on-current-main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/roles-on-current-main

      - name: Validate deployment configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.SKYNEST_FIREBASE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::Add FIREBASE_PROJECT_ID as a repository variable or secret."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Repository secret SKYNEST_FIREBASE_KEY is missing."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 - "$RUNNER_TEMP/firebase-service-account.json" "$FIREBASE_PROJECT_ID" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          if data.get("type") != "service_account":
              raise SystemExit("Credential JSON is not a service-account key.")
          if data.get("project_id") != sys.argv[2]:
              raise SystemExit("FIREBASE_PROJECT_ID does not match the service-account project_id.")
          if not data.get("client_email") or not data.get("private_key"):
              raise SystemExit("Service-account JSON is missing required fields.")
          print("Deployment credentials validated; secret values are not displayed.")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SKYNEST_FIREBASE_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore and Storage rules
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          firebase deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

