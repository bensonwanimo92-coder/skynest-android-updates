name: Deploy SkyNest M-Pesa Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out M-Pesa branch
        uses: actions/checkout@v4
        with:
          ref: feature/skynest-mpesa-cloudflare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        run: npm run check --prefix cloudflare-worker

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare-worker/wrangler.toml
