name: SkyNest M-Pesa Worker Checks
on:
  push:
    branches:
      - feature/skynest-mpesa-cloudflare
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/mpesa-worker-check.yml'
  pull_request:
    branches:
      - feature/skynest-mpesa-cloudflare
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/mpesa-worker-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
