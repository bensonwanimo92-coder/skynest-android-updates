name: Deploy SkyNest M-Pesa API to Google Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Check out M-Pesa branch
        uses: actions/checkout@v4
        with:
          ref: feature/skynest-mpesa-cloudflare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate API
        working-directory: cloud-run
        run: npm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: skynest-mpesa-api
          source: ./cloud-run
          region: ${{ secrets.GCP_REGION }}
          env_vars: DARAJA_ENV=sandbox
          flags: --allow-unauthenticated --min 0 --max 3
