name: SkyNest Flutter verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/skynest-elite-social-experience
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate Android runner when platform files are absent
        run: |
          if [ ! -d android ]; then
            flutter create --no-pub --platforms=android --org com.hello22_ --project-name chuka .
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(text)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skynest-elite-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
