name: SkyNest M-Pesa Worker validation

on:
  push:
    branches:
      - main
      - integration/roles-on-current-main
      - release/5533-corrected-from-5532
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-mpesa-cloudflare.yml"
      - ".github/workflows/mpesa-worker-tests.yml"
  pull_request:
    branches:
      - main
      - integration/roles-on-current-main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-mpesa-cloudflare.yml"
      - ".github/workflows/mpesa-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker syntax and payment validation
        working-directory: cloudflare-worker
        run: npm run check
