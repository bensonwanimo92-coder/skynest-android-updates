name: SkyNest M-Pesa Worker Checks

on:
  push:
    branches:
      - fix/mpesa-three-role-flow
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/mpesa-worker-checks.yml"
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/mpesa-worker-checks.yml"

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
