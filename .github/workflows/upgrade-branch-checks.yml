name: SkyNest Upgrade Branch Checks

on:
  push:
    branches:
      - feature/skynest-flexible-dashboard-upgrades
  pull_request:
    branches:
      - integration/roles-on-current-main

permissions:
  contents: read

concurrency:
  group: skynest-upgrade-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub
