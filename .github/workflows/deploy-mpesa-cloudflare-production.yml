name: Deploy SkyNest M-Pesa Worker to Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - fix/individual-landlord-daraja-credentials

permissions:
  contents: read

concurrency:
  group: skynest-mpesa-worker-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved Daraja branch
        uses: actions/checkout@v4
        with:
          ref: fix/individual-landlord-daraja-credentials

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker source
        working-directory: cloudflare-worker
        run: |
          node --check src/index.js
          node --check src/payment_validation.js

      - name: Run Worker unit tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Validate required deployment credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare-worker/wrangler.toml
