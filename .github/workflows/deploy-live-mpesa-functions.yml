name: Deploy SkyNest live payment Functions

on:
  push:
    branches:
      - integration/roles-on-current-main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-live-mpesa-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/roles-on-current-main

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase deployment credentials
        env:
          FIREBASE_PROJECT_ID: \${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.SKYNEST_FIREBASE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::FIREBASE_PROJECT_ID is missing."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::SKYNEST_FIREBASE_KEY is missing."; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 - "$RUNNER_TEMP/firebase-service-account.json" "$FIREBASE_PROJECT_ID" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              account = json.load(f)
          if account.get("type") != "service_account" or account.get("project_id") != sys.argv[2]:
              raise SystemExit("Firebase service-account project does not match FIREBASE_PROJECT_ID.")
          print("Firebase deployment identity validated.")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.SKYNEST_FIREBASE_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Create persistent encryption secret if absent
        env:
          FIREBASE_PROJECT_ID: \${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! gcloud secrets describe MPESA_CONFIG_ENCRYPTION_KEY --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            openssl rand -hex 32 | gcloud secrets create MPESA_CONFIG_ENCRYPTION_KEY \
              --replication-policy=automatic --data-file=- --project "$FIREBASE_PROJECT_ID"
            echo "Created persistent M-Pesa credential-encryption secret in Secret Manager."
          else
            echo "Persistent M-Pesa encryption secret already exists; preserving it."
          fi
          PROJECT_NUMBER="$(gcloud projects describe "$FIREBASE_PROJECT_ID" --format='value(projectNumber)')"
          gcloud secrets add-iam-policy-binding MPESA_CONFIG_ENCRYPTION_KEY \
            --project "$FIREBASE_PROJECT_ID" \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" \
            --quiet

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --omit=dev

      - name: Deploy Cloud Functions only (no test or emulator jobs)
        env:
          FIREBASE_PROJECT_ID: \${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
