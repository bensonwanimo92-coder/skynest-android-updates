name: SkyNest Gold Build 1.0.5
on:
  push:
    tags:
      - 'v*'
jobs:
  build-skynest-apk:
    name: Build SkyNest APK
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Setup Flutter Gold
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Prepare Project
        run: |
          flutter create --project-name skynest . --template app --overwrite
          rm -rf lib
          git checkout main -- lib
      - name: Build Gold APK 1.0.5
        run: flutter build apk --release --build-name=1.0.5 --build-number=2003
      - name: Publish Gold Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ github.ref_name }}
