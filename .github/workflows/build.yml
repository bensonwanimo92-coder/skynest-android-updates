name: SkyNest Signed Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skynest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.hello22_ --project-name chuka .
          sed -i 's/android:label="chuka"/android:label="SkyNest"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          content = p.read_text()
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace("</application>", meta + "\n    </application>")
          p.write_text(content)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s, count = re.subn(r"(?m)^\s*compileSdk\s*=\s*[^\n]+", "    compileSdk = 36", s, count=1)
              if count == 0:
                  raise SystemExit("Could not locate compileSdk in build.gradle.kts")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Flutter Android Gradle file not found")
              s = p.read_text()
              s, count = re.subn(r"(?m)^\s*compileSdkVersion\s+[^\n]+", "    compileSdkVersion 36", s, count=1)
              if count == 0:
                  s, count = re.subn(r"(?m)^\s*compileSdk\s+[^\n]+", "    compileSdk 36", s, count=1)
              if count == 0:
                  raise SystemExit("Could not locate compileSdk in build.gradle")
              p.write_text(s)
          PY

      - name: Configure Firebase Android app (optional)
        id: firebase
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_CONFIG_BASE64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase config is missing. Build validation may run, but no release APK will be published until Firebase is configured."
            exit 0
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin Gradle files were not generated.")
          text = settings.read_text()
          marker = '    id("com.android.application")'
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(marker, '    id("com.google.gms.google-services") version "4.4.2" apply false\n' + marker, 1)
          settings.write_text(text)
          text = app.read_text()
          marker = '    id("dev.flutter.flutter-gradle-plugin")'
          if 'id("com.google.gms.google-services")' not in text:
              if marker not in text:
                  raise SystemExit("Could not locate Flutter Gradle plugin in app build file.")
              text = text.replace(marker, marker + '\n    id("com.google.gms.google-services")', 1)
          app.write_text(text)
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Firebase Android configuration installed."

      - name: Verify original signing certificate and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/skynest-release.jks; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s android/app/skynest-release.jks ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -v -keystore android/app/skynest-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/skynest-keytool-check.txt 2>&1; then
            echo "ERROR: Java could not open the keystore using the supplied alias and store password. Safe diagnostic:"
            sed -E 's/(password|storepass|keypass)[^[:cntrl:]]*/[REDACTED]/Ig' /tmp/skynest-keytool-check.txt
            exit 1
          fi
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' /tmp/skynest-keytool-check.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          if [ -z "$actual" ]; then
            echo "ERROR: Could not read SHA-256 from the supplied keystore. Check the alias and keystore password."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: Signing certificate does not match the installed SkyNest app. Build stopped to protect app updates."
            echo "Expected original certificate SHA-256: $expected"
            echo "Supplied keystore certificate SHA-256: $actual"
            exit 1
          fi
          echo "Original SkyNest signing certificate verified."

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("skynest-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle.kts")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''    signingConfigs {
                  release {
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                      storeFile file('skynest-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace("signingConfig signingConfigs.debug",
                        "signingConfig signingConfigs.release")
          if 'signingConfig signingConfigs.release' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          else
            echo "ERROR: Flutter Android Gradle file not found."
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Force Android API 36 for app and plugin modules
        run: |
          cat > android/force-android-compile-sdk.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { project ->
              def androidExtension = project.extensions.findByName('android')
              if (androidExtension != null) {
                androidExtension.compileSdkVersion(36)
                println "SkyNest compileSdk override: ${project.path} -> Android 36"
              }
            }
          }
          GRADLE

      - name: Build signed release APK
        env:
          GRADLE_OPTS: -I ${{ github.workspace }}/android/force-android-compile-sdk.gradle
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --build-name=1.1.0 --build-number=2008

      - name: Verify built APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/skynest-apk-signature.txt
          package="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          echo "APK package: $package"
          test "$package" = "com.hello22_.chuka" || { echo "ERROR: Wrong APK package ID"; exit 1; }
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/skynest-apk-signature.txt | head -n 1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          test "$actual" = "$expected" || { echo "ERROR: Built APK certificate does not match original"; echo "Actual: $actual"; exit 1; }
          echo "Built APK package and original signing certificate verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skynest-android-1.1.0-2008
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.firebase.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.1.0+2008' || github.ref_name }}
          name: SkyNest Android 1.1.0 (build 2008)
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
