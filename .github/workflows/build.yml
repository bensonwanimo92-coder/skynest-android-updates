name: SkyNest Signed Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.hello22_ --project-name chuka .
          sed -i 's/android:label="chuka"/android:label="SkyNest"/' android/app/src/main/AndroidManifest.xml

      - name: Verify original signing certificate and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/skynest-release.jks; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s android/app/skynest-release.jks ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -v -keystore android/app/skynest-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/skynest-keytool-check.txt 2>&1; then
            echo "ERROR: Java could not open the keystore using the supplied alias and store password. Safe diagnostic:"
            sed -E 's/(password|storepass|keypass)[^[:cntrl:]]*/[REDACTED]/Ig' /tmp/skynest-keytool-check.txt
            exit 1
          fi
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' /tmp/skynest-keytool-check.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          if [ -z "$actual" ]; then
            echo "ERROR: Could not read SHA-256 from the supplied keystore. Check the alias and keystore password."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: Signing certificate does not match the installed SkyNest app. Build stopped to protect app updates."
            echo "Expected original certificate SHA-256: $expected"
            echo "Supplied keystore certificate SHA-256: $actual"
            exit 1
          fi
          echo "Original SkyNest signing certificate verified."

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("skynest-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle.kts")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''    signingConfigs {
                  release {
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                      storeFile file('skynest-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace("signingConfig signingConfigs.debug",
                        "signingConfig signingConfigs.release")
          if 'signingConfig signingConfigs.release' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          else
            echo "ERROR: Flutter Android Gradle file not found."
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --build-name=1.0.8 --build-number=2006

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skynest-android-1.0.8-2006
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.0.8+2006' || github.ref_name }}
          name: SkyNest Android 1.0.8 (build 2006)
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
