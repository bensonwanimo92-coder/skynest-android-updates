name: SkyNest Signed Release Build

on:
  push:
    branches:
      - main
      - fix/startup-resilience-shorebird
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skynest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.hello22_ --project-name chuka .
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "android.permission.INTERNET" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.INTERNET"/>\\n    <application', 1)
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace("</application>", meta + "\\n    </application>")
          manifest.write_text(text)
          rules = """# Keep Firebase and Google Mobile Ads runtime classes.
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class io.flutter.** { *; }
          -dontwarn com.google.firebase.**
          -dontwarn com.google.android.gms.**
          """
          Path("android/app/proguard-rules.pro").write_text(rules)
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              s = gradle.read_text()
              if 'isMinifyEnabled = false' not in s:
                  s = re.sub(r'(release\\s*\\{)', r'\\1\\n            isMinifyEnabled = false\\n            isShrinkResources = false\\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', s, count=1)
              gradle.write_text(s)
          else:
              gradle = Path("android/app/build.gradle")
              if not gradle.exists():
                  raise SystemExit("Android Gradle file missing after flutter create")
              s = gradle.read_text()
              if "minifyEnabled false" not in s:
                  s = re.sub(r'(release\\s*\\{)', r'\\1\\n            minifyEnabled false\\n            shrinkResources false\\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"', s, count=1)
              gradle.write_text(s)
          print("Android manifest, AdMob application ID and ProGuard rules configured.")
          PY
          sed -i 's/android:label="chuka"/android:label="SkyNest"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          content = p.read_text()
          internet = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", internet + "    <application", 1)
          meta = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace("</application>", meta + "\n    </application>")
          p.write_text(content)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s, count = re.subn(r"(?m)^\s*compileSdk\s*=\s*[^\n]+", "    compileSdk = 36", s, count=1)
              if count == 0:
                  raise SystemExit("Could not locate compileSdk in build.gradle.kts")
              s, min_count = re.subn(r"(?m)^\s*minSdk\s*=\s*[^\n]+", "    minSdk = 24", s, count=1)
              if min_count == 0:
                  raise SystemExit("Could not locate minSdk in build.gradle.kts")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Flutter Android Gradle file not found")
              s = p.read_text()
              s, count = re.subn(r"(?m)^\s*compileSdkVersion\s+[^\n]+", "    compileSdkVersion 36", s, count=1)
              if count == 0:
                  s, count = re.subn(r"(?m)^\s*compileSdk\s+[^\n]+", "    compileSdk 36", s, count=1)
              if count == 0:
                  raise SystemExit("Could not locate compileSdk in build.gradle")
              s, min_count = re.subn(r"(?m)^\s*minSdkVersion\s+[^\n]+", "    minSdkVersion 24", s, count=1)
              if min_count == 0:
                  s, min_count = re.subn(r"(?m)^\s*minSdk\s+[^\n]+", "    minSdk 24", s, count=1)
              if min_count == 0:
                  raise SystemExit("Could not locate minSdk in build.gradle")
              p.write_text(s)
          PY

      - name: Configure Firebase Android app (optional)
        id: firebase
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_CONFIG_BASE64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase config is missing. Build validation may run, but no release APK will be published until Firebase is configured."
            exit 0
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("android/app/google-services.json").read_text())
          project = cfg["project_info"]
          expected_package = "com.hello22_.chuka"
          client = next((c for c in cfg.get("client", [])
                         if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_package), None)
          if client is None:
              raise SystemExit(f"Firebase google-services.json has no Android client for {expected_package}")
          api_key = next((k["current_key"] for k in client.get("api_key", []) if k.get("current_key")), None)
          if not api_key:
              raise SystemExit("Firebase API key is missing from google-services.json")
          app_id = client["client_info"]["mobilesdk_app_id"]
          project_id = project["project_id"]
          sender_id = project["project_number"]
          bucket = project.get("storage_bucket")
          dart = """// Generated during CI from the protected Firebase Android configuration.
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                throw UnsupportedError('SkyNest currently supports Android only.');
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                default:
                  throw UnsupportedError('SkyNest Firebase options are configured for Android only.');
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: API_KEY,
              appId: APP_ID,
              messagingSenderId: SENDER_ID,
              projectId: PROJECT_ID,
              storageBucket: STORAGE_BUCKET,
            );
          }
          """
          replacements = {
              "API_KEY": json.dumps(api_key),
              "APP_ID": json.dumps(app_id),
              "SENDER_ID": json.dumps(sender_id),
              "PROJECT_ID": json.dumps(project_id),
              "STORAGE_BUCKET": json.dumps(bucket or (project_id + ".appspot.com")),
          }
          for key, value in replacements.items():
              dart = dart.replace(key, value)
          Path("lib/firebase_options.dart").write_text(dart)
          print("Generated lib/firebase_options.dart for the existing SkyNest Android package.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          if not settings.exists() or not app.exists():
              raise SystemExit("Expected Kotlin Gradle files were not generated.")
          text = settings.read_text()
          marker = '    id("com.android.application")'
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(marker, '    id("com.google.gms.google-services") version "4.4.2" apply false\n' + marker, 1)
          settings.write_text(text)
          text = app.read_text()
          marker = '    id("dev.flutter.flutter-gradle-plugin")'
          if 'id("com.google.gms.google-services")' not in text:
              if marker not in text:
                  raise SystemExit("Could not locate Flutter Gradle plugin in app build file.")
              text = text.replace(marker, marker + '\n    id("com.google.gms.google-services")', 1)
          app.write_text(text)
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Firebase Android configuration installed."

      - name: Verify original signing certificate and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/skynest-release.jks; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s android/app/skynest-release.jks ]; then
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -v -keystore android/app/skynest-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/skynest-keytool-check.txt 2>&1; then
            echo "ERROR: Java could not open the keystore using the supplied alias and store password. Safe diagnostic:"
            sed -E 's/(password|storepass|keypass)[^[:cntrl:]]*/[REDACTED]/Ig' /tmp/skynest-keytool-check.txt
            exit 1
          fi
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' /tmp/skynest-keytool-check.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          if [ -z "$actual" ]; then
            echo "ERROR: Could not read SHA-256 from the supplied keystore. Check the alias and keystore password."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: Signing certificate does not match the installed SkyNest app. Build stopped to protect app updates."
            echo "Expected original certificate SHA-256: $expected"
            echo "Supplied keystore certificate SHA-256: $actual"
            exit 1
          fi
          echo "Original SkyNest signing certificate verified."

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("skynest-release.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle.kts")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          signing = '''    signingConfigs {
                  release {
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                      storeFile file('skynest-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }

          '''
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes in build.gradle")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace("signingConfig signingConfigs.debug",
                        "signingConfig signingConfigs.release")
          if 'signingConfig signingConfigs.release' not in s:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY
          else
            echo "ERROR: Flutter Android Gradle file not found."
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Force Android API 36 for every Flutter plugin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if not root.is_dir():
              raise SystemExit("Flutter pub cache not found after dependency resolution.")

          auth_files = list(root.glob("firebase_auth-*/android/build.gradle*"))
          if not auth_files:
              raise SystemExit("firebase_auth Android Gradle file was not found.")

          patched = []
          for gradle_file in root.rglob("build.gradle*"):
              if "android" not in gradle_file.parts:
                  continue
              lines = gradle_file.read_text().splitlines()
              output = []
              changed = False
              for line in lines:
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if (stripped.startswith("compileSdkVersion") or
                      stripped.startswith("compileSdk ") or
                      stripped.startswith("compileSdk=")):
                      if gradle_file.name.endswith(".gradle.kts"):
                          output.append(indent + "compileSdk = 36")
                      else:
                          output.append(indent + "compileSdkVersion 36")
                      changed = True
                  else:
                      output.append(line)
              if changed:
                  gradle_file.write_text(chr(10).join(output) + chr(10))
                  patched.append(str(gradle_file))

          for auth_file in auth_files:
              lines = auth_file.read_text().splitlines()
              if not any(line.strip() == "compileSdkVersion 36" for line in lines):
                  raise SystemExit(f"firebase_auth compile SDK was not set to 36: {auth_file}")

          print(f"Patched {len(patched)} Android plugin Gradle files.")
          print("Verified firebase_auth compileSdkVersion 36.")
          for file in patched:
              print(f"Patched: {file}")
          PY

      - name: Build and register signed Shorebird release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: shorebird release android --artifact apk --build-name=1.1.1 --build-number=2009 -- --no-obfuscate

      - name: Verify built APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/skynest-apk-signature.txt
          package="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          echo "APK package: $package"
          test "$package" = "com.hello22_.chuka" || { echo "ERROR: Wrong APK package ID"; exit 1; }
          actual="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/skynest-apk-signature.txt | head -n 1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="106BEBFDDB78488B4817608A97417ED5AFAE4C88D5FCB00B29572B4DA554BB0F"
          test "$actual" = "$expected" || { echo "ERROR: Built APK certificate does not match original"; echo "Actual: $actual"; exit 1; }
          echo "Built APK package and original signing certificate verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skynest-android-1.1.0-2008
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.firebase.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.1.0+2008' || github.ref_name }}
          name: SkyNest Android 1.1.0 (build 2008)
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
