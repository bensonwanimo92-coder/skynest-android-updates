name: Initialize SkyNest with Shorebird

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.hello22_ --project-name chuka .

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Initialize SkyNest in Shorebird
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SHOREBIRD_TOKEN:-}" || { echo "::error::SHOREBIRD_TOKEN repository secret is missing."; exit 1; }
          shorebird init --display-name "SkyNest"

      - name: Commit generated Shorebird configuration
        run: |
          set -euo pipefail
          test -s shorebird.yaml || { echo "::error::shorebird.yaml was not generated."; exit 1; }
          grep -q 'shorebird.yaml' pubspec.yaml || { echo "::error::pubspec.yaml does not include shorebird.yaml as an asset."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          if git diff --cached --quiet; then
            echo "No Shorebird configuration changes to commit."
          else
            git commit -m "Initialize SkyNest Shorebird app"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Shorebird initialization complete. App ID:"
          sed -n 's/^app_id: */app_id: /p' shorebird.yaml
